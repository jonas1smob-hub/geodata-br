<title>Jacareí em Movimento</title>
<style>.maplibregl-map{position:relative;overflow:hidden}.maplibregl-canvas{position:absolute;left:0;top:0}.maplibregl-canvas-container{width:100%;height:100%}.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right{display:none}</style>
<style>
:root{--ink:#e9ecff;--dim:#8f95c4;--panel:rgba(18,16,48,.72);--line:rgba(160,150,255,.18);--soft:rgba(255,255,255,.06);--hov:rgba(255,255,255,.14);--h1:linear-gradient(90deg,#ffd27a,#ff7ac6 55%,#7ad7ff);--btn:#ffd27a;--btnink:#22124a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0a26;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 25%,#2a1f63 0%,#171448 45%,#0b0a26 100%)}
.maplibregl-ctrl-attrib{display:none}
#panel{position:absolute;top:16px;left:16px;width:290px;max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#panel header{padding:18px 18px 12px}
h1{margin:0;font-size:22px;letter-spacing:.3px;font-weight:700;background:var(--h1);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:12.5px;margin-top:4px}
.stats{display:flex;gap:8px;padding:0 18px 12px}
.stat{flex:1;background:var(--soft);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.btns{display:flex;gap:4px;white-space:nowrap;padding:0 18px 12px}
button{font:inherit;font-size:11.5px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 8px;cursor:pointer}
button:hover{background:var(--hov)}button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#list{overflow:auto;padding:4px 10px 12px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:10px;cursor:pointer;font-size:12.5px}
.row:hover{background:var(--soft)}.row.off{opacity:.3}
.chip{min-width:34px;text-align:center;font-weight:700;font-size:11.5px;color:#15103a;border-radius:7px;padding:2px 5px}
.row span.n{flex:1;line-height:1.15}
#tip{position:absolute;pointer-events:none;display:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;max-width:240px;z-index:5}
#hint{position:absolute;right:16px;bottom:14px;font-size:11.5px;color:var(--dim);background:var(--panel);padding:4px 10px;border-radius:999px}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 18px 12px}
.th{height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer;padding:0;position:relative}
.th.on{border-color:var(--ink)}.th i{position:absolute;inset:auto 4px 3px 4px;height:5px;border-radius:3px}
.tl{padding:0 18px 4px;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
@media(max-width:700px){#panel{width:auto;right:16px;max-height:40%}#hint{display:none}}
.nbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;pointer-events:none;white-space:nowrap}
#ctx{padding:0 18px 10px;font-size:11px;color:var(--dim)}

 const root=document.documentElement.style,mapEl=document.getElementById('map');
 const setP=(id,p,v)=>{if(map.getLayer(id))map.setPaintProperty(id,p,v)};
 function applyTheme(key){
  const T=TH[key];info.forEach((i,k)=>i.c=T.route(k,info.length));
  Object.entries(T.ui).forEach(([k,v])=>root.setProperty('--'+k,v));mapEl.style.background=T.bg;
  const ce=['match',['get','r'],...info.flatMap(i=>[i.r,i.c]),'#fff'];
  setP('top','fill-color',T.land);setP('o-wood','fill-color',T.wood);setP('o-park','fill-color',T.park);setP('o-res','fill-color',T.res);setP('o-ind','fill-color',T.ind);setP('o-water','fill-color',T.water);setP('o-waterway','line-color',T.waterway);
  setP('o-road-min','line-color',T.roadMin);setP('o-road-maj','line-color',T.roadMaj);setP('o-road-hw','line-color',T.roadHw);setP('o-rail','line-color',T.rail);
  setP('o-bld','fill-extrusion-color',['interpolate',['linear'],['get','render_height'],0,T.b[0],40,T.b[1],120,T.b[2]]);
  setP('nb','fill-color',T.ind);setP('nb-line','line-color',T.roadMaj);nbLabels.forEach(e=>{e.style.color=T.label;e.style.textShadow=`0 0 4px ${T.halo},0 0 4px ${T.halo}`});
  setP('mask','fill-color',T.mask);setP('mask','fill-opacity',T.maskOp);setP('grid','line-color',T.grid);setP('grid','line-opacity',T.gridOp);
  setP('topglow','line-color',T.glow);setP('edge','line-color',T.edge);setP('casing','line-color',T.casing);
  [8,6,4,2].forEach(i=>setP('side'+i,'line-color',T.side));
  setP('place','text-color',T.label);setP('place','text-halo-color',T.halo);
  setP('glow','line-color',ce);setP('route','line-color',ce);
  setP('glow','line-opacity',T.light?.22:.35);
  setP('bars','fill-extrusion-color',['interpolate',['linear'],['get','t'],1,T.bars[0],300,T.bars[1],1500,T.bars[2]]);
  map.setLight({anchor:'viewport',color:'#ffffff',intensity:T.light?.3:.45,position:[1.2,200,50]});
  document.querySelectorAll('.chip').forEach(c=>{const i=info.find(x=>x.r===c.parentNode.dataset.r);if(i){c.style.background=i.c;c.style.color=T.light?'#fff':'#15103a'}});
  document.getElementById('tname').textContent=T.name;
  document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
  try{localStorage.setItem('jtheme',key)}catch(e){}
 }

 const tip=document.getElementById('tip');
 map.on('mousemove',e=>{const fs=map.queryRenderedFeatures(e.point,{layers:['bars','route']});map.getCanvas().style.cursor=fs.length?'pointer':'';
  if(!fs.length){tip.style.display='none';return}const p=fs[0].properties;
